server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20M;
    server_tokens off;

    # Compress text (HTML, CSS, JS, JSON, SVG) — faster on mobile data.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # Security headers for everything, including cached pages served without PHP.
    # (PHP's copies are hidden below so each header is sent once.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Static page cache (guests only): plain GET, no query string, no km_session cookie.
    set $page_cache "/page-cache$uri.html";
    if ($uri = "/") { set $page_cache "/page-cache/index.html"; }
    if ($request_method != GET) { set $page_cache "/nocache"; }
    if ($args != "") { set $page_cache "/nocache"; }
    if ($http_cookie ~* "km_session") { set $page_cache "/nocache"; }

    location / {
        # Serve the cached copy through the /page-cache/ block (it adds the headers).
        if (-f $document_root$page_cache) { rewrite ^ $page_cache last; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cached guest pages: served straight from disk, so send the full header set here.
    location ^~ /page-cache/ {
        internal;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Xw+iXV1g6Uwe+/grlE5MEUAXKtap/VwHEZMIn78C1Zg=' 'sha256-27XGFHDcaMoj0U3D/vyaOXEGOp2INOhZJJ83/7zFbGw='; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # The service worker must never be cached for long, or an update would take a year to reach phones.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location ~* \.(?:css|js|webp|avif|jpg|jpeg|png|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # Files on disk are served directly; anything else (e.g. the member's
        # referral QR at /account/referral-qr.svg) goes to Laravel.
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Permissions-Policy;
        fastcgi_hide_header Cross-Origin-Opener-Policy;
        fastcgi_hide_header Cross-Origin-Resource-Policy;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:env|log|sql|sqlite|bak|zip|tar|gz)$ { deny all; }
}
