server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20M;
    server_tokens off;

    # Static page cache (guests only): plain GET, no query string, no km_session cookie.
    set $page_cache "/page-cache$uri.html";
    if ($uri = "/") { set $page_cache "/page-cache/index.html"; }
    if ($request_method != GET) { set $page_cache "/nocache"; }
    if ($args != "") { set $page_cache "/nocache"; }
    if ($http_cookie ~* "km_session") { set $page_cache "/nocache"; }

    location / {
        try_files $page_cache $uri $uri/ /index.php?$query_string;
    }

    location ^~ /page-cache/ { internal; }

    location ~* \.(?:css|js|webp|avif|jpg|jpeg|png|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) { deny all; }
}
