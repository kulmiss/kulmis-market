server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20M;
    server_tokens off;

    # Static page cache (storefront PR): serve pre-rendered HTML when present.
    location / {
        try_files /page-cache/$uri.html /page-cache/$uri/index.html $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(?:css|js|webp|avif|jpg|jpeg|png|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) { deny all; }
}
