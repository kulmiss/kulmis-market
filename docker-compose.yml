services:
  app:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    volumes: [".:/var/www/html"]
    depends_on: { mysql: { condition: service_healthy } }

  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${APP_PORT:-8080}:80"]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  # VPS-style worker. With QUEUE_VIA_SCHEDULER=true (shared-hosting mode)
  # the scheduler below drains the queue instead; both are safe together.
  queue:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes: [".:/var/www/html"]
    depends_on: { mysql: { condition: service_healthy } }
    restart: unless-stopped

  scheduler:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    command: php artisan schedule:work
    volumes: [".:/var/www/html"]
    depends_on: { mysql: { condition: service_healthy } }
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: kulmis-market
      MYSQL_USER: kulmis
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports: ["127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret", "-ukulmis"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]

volumes:
  mysql-data:
